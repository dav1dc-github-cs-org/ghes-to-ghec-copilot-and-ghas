name: Dependency review

# Required workflow for the product-line ruleset. Reports vulnerable dependencies that a pull
# request adds.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Scanning first, gates later: report without failing the check.
          warn-only: true
          comment-summary-in-pr: always
